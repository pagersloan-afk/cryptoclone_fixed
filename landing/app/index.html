<!DOCTYPE html>
<html>
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cryptoclone_fixed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/assets/images/favicon.png"/>
  <title>cryptoclone_fixed</title>
  <link rel="manifest" href="manifest.json">

  <!-- 🔧 Spinner Animation -->
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- 🔄 Static Splash Screen -->
  <div id="splash-screen" style="
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    height: 100vh;
    background-color: #f5f5f5;
    font-family: 'Segoe UI', sans-serif;
    color: #333;
  ">
    <img src="assets/assets/images/app_logo.png" alt="IGEG Vault Logo" style="
  width: 120px;
  margin-bottom: 20px;
  animation: spin 1.5s linear infinite;
" />

    <p style="font-size: 1.2rem;">Loading your financial hub...</p>
    <div class="loader" style="
      border: 4px solid #ccc;
      border-top: 4px solid #0070c9;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    "></div>
  </div>

  <!-- 🧠 Flutter Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function () {
      const splash = document.getElementById('splash-screen');
      if (splash) splash.style.display = 'none';
    });
  </script>
</body>
</html>
