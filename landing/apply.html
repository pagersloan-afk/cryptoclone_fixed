<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="icon" type="image/png" href="app/assets/assets/images/favicon.png" />
  <title>Loan Application Portal</title>
  <link rel="stylesheet" href="styles/applications.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    .app-wrapper {
      max-width: 900px;
      margin: 4rem auto;
      padding: 2rem;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .app-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .app-header h1 {
      font-size: 2rem;
      color: #c20000;
    }

    .loan-selector {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .loan-selector button {
      padding: 0.75rem 1.5rem;
      border: 1px solid #c20000;
      background-color: #fff;
      color: #c20000;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .loan-selector button:hover {
      background-color: #c20000;
      color: #fff;
    }

    .loan-form {
      display: none;
    }

    .loan-form.active {
      display: block;
    }

    .loan-form h2 {
      color: #c20000;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .ps-btn-primary {
      background-color: #c20000;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .ps-btn-primary:hover {
      background-color: #a00000;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="app-header">
      <h1>Start Your Loan Application</h1>
      <p>Select a loan type to begin</p>
    </div>

    <!-- Loan Type Selector -->
<div class="loan-selector">
  <button onclick="showForm('fixFlip')">Fix & Flip</button>
  <button onclick="showForm('dscr')">DSCR Rental</button>
  <button onclick="showForm('newConstruction')">New Construction</button>
  <button onclick="showForm('rental')">Rental Loan</button>
  <button onclick="showForm('personal')">Personal Loan</button>
  <button onclick="showForm('auto')">Auto Loan</button>
  <button onclick="showForm('business')">Business Loan</button>
  <button onclick="showForm('equity')">Equity Loan</button>
</div>


    <!-- Fix & Flip Form -->
<form id="fixFlip" class="loan-form active" action="/submit-fix-flip" method="POST">
  <input type="hidden" name="loanType" value="Fix & Flip" />
  <h2>Fix & Flip Loan</h2>

  <!-- Basic Info -->
  <div class="form-group">
    <label for="ffName">Full Name*</label>
    <input type="text" id="ffName" name="fullName" required />
  </div>
  <div class="form-group">
    <label for="ffEmail">Email*</label>
    <input type="email" id="ffEmail" name="email" required />
  </div>
  <div class="form-group">
    <label for="ffLocation">Property Location*</label>
    <input type="text" id="ffLocation" name="propertyLocation" required />
  </div>
  <div class="form-group">
    <label for="ffARV">Estimated ARV ($)*</label>
    <input type="number" id="ffARV" name="estimatedARV" required />
  </div>

  <!-- Loan Amount -->
<div class="form-group">
  <label for="loanAmount">Requested Loan Amount ($)*</label>
  <input type="number" id="loanAmount" name="loanAmount" required />
</div>

<!-- Repayment Structure -->
<div class="form-group">
  <label for="repaymentType">Repayment Type*</label>
  <select id="repaymentType" name="repaymentType" required>
    <option value="">- Select -</option>
    <option value="interestOnly">Interest Only</option>
    <option value="principalInterest">Principal & Interest</option>
  </select>
</div>

<!-- Repayment Frequency -->
<div class="form-group">
  <label for="repaymentFrequency">Repayment Frequency*</label>
  <select id="repaymentFrequency" name="repaymentFrequency" required>
    <option value="">- Select -</option>
    <option value="weekly">Weekly</option>
    <option value="monthly">Monthly</option>
    <option value="quarterly">Quarterly</option>
    <option value="semiAnnual">Semi-Annual</option>
    <option value="annual">Annual</option>
    <option value="balloon">Balloon Payment</option>
  </select>
</div>
<!-- New Repayment Term Field -->
<div class="form-group">
  <label for="repaymentTerm">Repayment Term (up to 25 years)*</label>
  <input
    type="number"
    id="repaymentTerm"
    name="repaymentTerm"
    min="1"
    max="25"
    required
    placeholder="Enter number of years"
  />
</div>


  <!-- Broker Info -->
  <div class="form-group">
    <label for="broker">Broker/Referring Party</label>
    <input type="text" id="broker" name="broker" />
  </div>

  <!-- Borrower Info -->
  <div class="form-group">
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" name="firstName" />
  </div>
  <div class="form-group">
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" name="lastName" />
  </div>
  <div class="form-group">
    <label for="homePhone">Home Phone</label>
    <input type="tel" id="homePhone" name="homePhone" placeholder="(xxx) xxx - xxxx Ext xxxx" />
  </div>
  <div class="form-group">
    <label for="cellPhone">Cell Phone</label>
    <input type="tel" id="cellPhone" name="cellPhone" placeholder="(xxx) xxx - xxxx" />
  </div>
  <div class="form-group">
    <label>Is there a Co-borrower?</label>
    <select name="coBorrower">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>

  <!-- Personal Info -->
  <div class="form-group">
    <label>Citizenship</label>
    <select name="citizenship">
      <option value="us">U.S. Citizen</option>
      <option value="perm">Perm Resident</option>
      <option value="nonperm">Non-Perm Resident</option>
      <option value="foreign">Foreign National</option>
    </select>
  </div>
  <div class="form-group">
    <label>Credit Score Range</label>
    <select name="creditScore">
      <option>- Select -</option>
      <option>600–649</option>
      <option>650–699</option>
      <option>700+</option>
    </select>
  </div>

  <!-- Borrower Type -->
  <div class="form-group">
    <label>Borrower Type</label>
    <select name="borrowerType">
      <option>- Select -</option>
      <option>Individual</option>
      <option>LLC</option>
      <option>Corporation</option>
    </select>
  </div>

  <!-- Borrower Background -->
  <div class="form-group">
    <label>Has the borrower been declared bankrupt within the past 7 years?</label>
    <select name="bankrupt">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>
  <div class="form-group">
    <label>Do you have any active lawsuits against you?</label>
    <select name="lawsuits">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>
  <div class="form-group">
    <label>Have you ever been convicted of a felony or other fraud related crimes?</label>
    <select name="felony">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>
  <div class="form-group">
    <label>Have you had property foreclosed upon in the last 7 years?</label>
    <select name="foreclosure">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>

  <!-- Borrower Experience -->
  <div class="form-group">
    <label>Does borrower have Fix & Flip or Buy & Hold experience?</label>
    <select name="experience">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>
  <div class="form-group">
    <label>Does borrower have ground up construction experience?</label>
    <select name="constructionExperience">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>
  <div class="form-group">
    <label>Do you have any professional licenses?</label>
    <select name="licenses">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>

  <!-- Transaction Details -->
  <div class="form-group">
    <label>Is there an accepted purchase agreement?</label>
    <select name="purchaseAgreement">
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>
  </div>

  <button type="submit" class="ps-btn-primary">Submit Fix & Flip</button>
</form>
